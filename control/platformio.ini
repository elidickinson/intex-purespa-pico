; Build: source wifi.env && uvx platformio run (update.sh and flash-usb.sh do this)
; wifi.env (gitignored) holds: export WIFI_SSID=... WIFI_PASS=... WEB_PASS=... TIMEZONE=...
; WEB_PASS protects the web page (user "spa") and over-the-air updates. TIMEZONE is a POSIX TZ
; string, e.g. EST5EDT,M3.2.0,M11.1.0 for New York.
; Output: .pio/build/pico_w/firmware.uf2
[platformio]
src_dir = .
default_envs = pico_w

[env:pico_w]
platform = raspberrypi
board = rpipicow
framework = arduino
board_build.core = earlephilhower
; Over-the-air updates are stored here before the bootloader installs them
board_build.filesystem_size = 1m
platform_packages =
    earlephilhower/framework-arduinopico @ https://github.com/earlephilhower/arduino-pico/releases/download/6.0.0/rp2040-6.0.0.zip
build_src_filter = +<*> -<tests/>
build_flags =
    '-DWIFI_SSID="${sysenv.WIFI_SSID}"'
    '-DWIFI_PASS="${sysenv.WIFI_PASS}"'
    '-DWEB_PASS="${sysenv.WEB_PASS}"'
    '-DTIMEZONE="${sysenv.TIMEZONE}"'

; The built-in espota upload runs with --debug, which prints the password. The image is sent
; gzipped: the Pico stores it in LittleFS before installing it, and uncompressed updates ran out
; of room there.
[env:ota]
extends = env:pico_w
upload_protocol = custom
upload_port = spa.local
upload_command = gzip -9kf "$SOURCE" && "$PYTHONEXE" "${platformio.packages_dir}/framework-arduinopico/tools/espota.py" -r -i $UPLOAD_PORT -p 2040 -a "${sysenv.WEB_PASS}" -f "${SOURCE}.gz"
