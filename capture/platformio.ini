; Build: source wifi.env && uvx platformio run
; wifi.env (gitignored) holds: export WIFI_SSID=... WIFI_PASS=... LOG_HOST=...
; LOG_HOST is the IP of the computer running listen.py.
; Output: .pio/build/pico_w/firmware.uf2
[platformio]
src_dir = .

[env:pico_w]
platform = raspberrypi
board = rpipicow
framework = arduino
board_build.core = earlephilhower
platform_packages =
    earlephilhower/framework-arduinopico @ https://github.com/earlephilhower/arduino-pico/releases/download/6.0.0/rp2040-6.0.0.zip
build_flags =
    '-DWIFI_SSID="${sysenv.WIFI_SSID}"'
    '-DWIFI_PASS="${sysenv.WIFI_PASS}"'
    '-DLOG_HOST="${sysenv.LOG_HOST}"'
