esphome:
  name: spa
  friendly_name: Spa

rp2:
  board: rpipicow

# Enable logging
logger:
  level: INFO

# Enable Home Assistant API
# ESPHome API/OTA secrets - generate your own, e.g. "esphome config spa.yaml" prints errors until they are set
api:
  encryption:
    key: "REPLACE_WITH_GENERATED_BASE64_KEY"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot in case wifi connection fails
  ap:
    ssid: "Spa Fallback Hotspot"
    password: "REPLACE_ME_123"


external_components:
  - source: ./components
    components: [purespa]

purespa:
  climate:
    name: Temp
  power:
    name: Power
    icon: mdi:power
  filter:
    name: Filter
    icon: mdi:air-filter
  bubble:
    name: Bubble
    icon: mdi:chart-bubble
  error_text:
    name: Error    

climate:
text_sensor:
switch:
